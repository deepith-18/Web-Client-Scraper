# CodeRabbit configuration for Demanex
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: "en-US"

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  # Focus security review on these paths
  path_filters:
    - "backend/**"
    - "frontend/src/**"
    - ".github/workflows/**"
    - "docker-compose.yml"

  # Request reviews for high-risk change types
  request_changes_workflow: false

  tools:
    # Semgrep SAST — catches SQL injection, XSS, hardcoded secrets, OWASP Top 10
    semgrep:
      enabled: true
    # GitHub security advisories
    github-checks:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: true

  review_status: true

  poem: false   # disable the poem in review summary

# Custom instructions for every PR review
instructions: |
  You are reviewing the Demanex B2B lead-generation platform.
  Focus especially on:
  1. Hardcoded secrets, passwords, or API keys in source code
  2. SQL injection via raw string formatting in SQLAlchemy
  3. Missing authentication/authorization guards on API endpoints
  4. CORS misconfiguration (allow_origins=["*"] in production)
  5. Missing input validation or rate limiting on auth endpoints
  6. Firebase token verification bypasses
  7. Sensitive data (PII, call recordings) logged to console
  8. Any use of eval(), exec(), or subprocess with user input
  Stack: FastAPI (Python 3.11) + SQLAlchemy + Next.js 14 (TypeScript) + Firebase Auth.

