name: Demanex CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Demanex Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Syntax & Lint Inspection (flake8)
        run: |
          # Stop build only on critical syntax errors or undefined symbols
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Informational style inspection
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Clean Test Database
        run: |
          rm -f prospectiq.db

      - name: Run Complete Pytest Suite with Coverage
        env:
          SECRET_KEY: ci-testing-secret-key-demanex-32chars
        run: |
          pytest backend/tests -v --cov=backend.app --cov-report=term --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  frontend-test:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Demanex Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install --prefer-offline --no-audit

      - name: TypeScript Static Type Check (tsc --noEmit)
        working-directory: ./frontend
        run: |
          npm run type-check

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm run build

  integration-smoke:
    name: E2E API Integration Smoke Check
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Demanex Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Launch Server & Run Live Smoke Checks
        env:
          SECRET_KEY: ci-test-secret-key-for-demanex-32chars
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD || 'ci-admin-seed-pass' }}
          CALLER_SEED_PASSWORD: ${{ secrets.CALLER_SEED_PASSWORD || 'ci-caller-seed-pass' }}
        run: |
          rm -f prospectiq.db
          # Start FastAPI server with log output to file
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          SERVER_PID=$!

          # Wait for server readiness (up to 30 seconds)
          echo "Waiting for Demanex backend to become responsive..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/health > /dev/null 2>&1; then
              READY=1
              echo "Server ready after ${i}s."
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "ERROR: Server failed to start within 30 seconds."
            echo "=== SERVER LOGS ==="
            cat /tmp/uvicorn.log
            exit 1
          fi

          echo "1. Checking Health endpoint..."
          curl -f -s http://127.0.0.1:8000/health || { cat /tmp/uvicorn.log; exit 1; }

          echo "2. Checking Root branding..."
          ROOT_JSON=$(curl -f -s http://127.0.0.1:8000/)
          echo "$ROOT_JSON" | grep -q "Demanex" || { echo "Branding check failed: $ROOT_JSON"; exit 1; }

          echo "3. Checking OpenAPI specification..."
          curl -f -s http://127.0.0.1:8000/api/v1/openapi.json | grep -q "Authentication" || exit 1

          echo "4. Seeding admin user for smoke test..."
          ADMIN_SEED_PASSWORD=$ADMIN_SEED_PASSWORD python -m backend.app.core.seed

          echo "5. Testing Seeded Admin Authentication..."
          LOGIN_RES=$(curl -s -X POST http://127.0.0.1:8000/api/v1/auth/login-json \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@demanex.io\",\"password\":\"$ADMIN_SEED_PASSWORD\"}")
          echo "$LOGIN_RES" | grep -q "access_token" || { echo "Admin login failed: $LOGIN_RES"; exit 1; }

          echo "6. Testing Public Discovery Sources..."
          curl -f -s http://127.0.0.1:8000/api/v1/discovery/sources | grep -q "OpenStreetMap" || exit 1

          echo "All live smoke checks passed successfully!"
          kill $SERVER_PID || true
