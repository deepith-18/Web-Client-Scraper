version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: demanex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: demanex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demanex_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/demanex
      - SECRET_KEY=demanex-production-secret-key-32chars
      - REQUEST_TIMEOUT_SECONDS=15
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demanex_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

